name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 5.0.7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwayland-dev libxkbcommon-dev wayland-protocols \
            libx11-dev libxrandr-dev libxinerama-dev libxi-dev libxcursor-dev \
            libgl1-mesa-dev

      - name: Configure CMake
        run: emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build-wasm -j$(nproc)

      - name: Prepare deploy directory
        run: |
          mkdir -p deploy
          cp build-wasm/opengl-renderer.html deploy/index.html
          cp build-wasm/opengl-renderer.js   deploy/
          cp build-wasm/opengl-renderer.wasm deploy/
          cp build-wasm/opengl-renderer.data deploy/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

